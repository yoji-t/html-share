<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Share | マイコンテンツ一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(56, 189, 248, 0.4);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #818cf8;
      --tag-bg: rgba(56, 189, 248, 0.12);
      --tag-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(129, 140, 248, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2.5rem 1rem 4rem;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: var(--primary);
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    @media (min-width: 640px) {
      .controls {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      max-width: 480px;
    }

    .search-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
    }

    .count-badge {
      color: var(--text-muted);
      font-size: 0.9rem;
      padding-left: 0.25rem;
    }

    .posts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width: 768px) {
      .posts-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .post-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .post-card:hover {
      transform: translateY(-3px);
      border-color: var(--card-hover-border);
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.4), 0 0 16px rgba(56, 189, 248, 0.08);
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }

    .post-date {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .post-tag {
      background: var(--tag-bg);
      color: var(--tag-color);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
    }

    .post-title {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.6rem;
    }

    .post-title a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.15s;
    }

    .post-title a:hover {
      color: var(--primary);
    }

    .post-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }

    .post-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      border: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #0b0f19;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    footer {
      margin-top: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding-top: 3rem;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-badge">
        <span>⚡</span> Antigravity Publisher
      </div>
      <h1>HTML Share</h1>
      <p class="subtitle">スマホからAntigravityチャットにHTMLコードを貼り付けるだけで自動追加されるコンテンツ集</p>
    </header>

    <div class="controls">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="タイトルや内容で検索...">
      </div>
      <div class="count-badge" id="postCount">読み込み中...</div>
    </div>

    <div class="posts-grid" id="postsContainer">
      <!-- JavaScriptで動的生成 -->
      <noscript>
        <div class="post-card">
          <div class="post-title"><a href="posts/welcome.html">ようこそ！HTML Shareへ</a></div>
          <p class="post-desc">スマホからAntigravityチャットにHTMLコードを貼り付けるだけで、自動でGitHub Pagesへ公開されるシステムです。</p>
        </div>
      </noscript>
    </div>

    <footer>
      Powered by <strong>Antigravity</strong> & <strong>GitHub Pages</strong>
    </footer>
  </div>

  <div class="toast" id="toast">URLをコピーしました！</div>

  <script>
    let allPosts = [];

    async function loadPosts() {
      try {
        const res = await fetch('posts.json?t=' + Date.now());
        if (!res.ok) throw new Error('posts.json not found');
        allPosts = await res.json();
      } catch (err) {
        console.warn('Fallback to default posts', err);
        allPosts = [
          {
            id: 'welcome',
            title: 'ようこそ！HTML Shareへ',
            filename: 'posts/welcome.html',
            dateFormatted: '2026/10/14',
            description: 'スマホからAntigravityチャットにHTMLコードを貼り付けるだけで、自動でGitHub Pagesへ公開されるシステムです。',
            tags: ['初期設定', 'ウェルカム']
          }
        ];
      }
      renderPosts(allPosts);
    }

    function renderPosts(posts) {
      const container = document.getElementById('postsContainer');
      const countEl = document.getElementById('postCount');
      countEl.textContent = `全 ${posts.length} 件のコンテンツ`;

      if (posts.length === 0) {
        container.innerHTML = '<div class="empty-state">一致するコンテンツが見つかりませんでした。</div>';
        return;
      }

      container.innerHTML = posts.map(post => {
        const fullUrl = new URL(post.filename, window.location.href).href;
        const tagsHtml = (post.tags || []).map(t => `<span class="post-tag">${escapeHtml(t)}</span>`).join('');
        return `
          <div class="post-card">
            <div>
              <div class="post-meta">
                <span class="post-date">📅 ${escapeHtml(post.dateFormatted || '')}</span>
                ${tagsHtml}
              </div>
              <h2 class="post-title">
                <a href="${encodeURI(post.filename)}" target="_blank" rel="noopener noreferrer">${escapeHtml(post.title)}</a>
              </h2>
              <p class="post-desc">${escapeHtml(post.description || '説明なし')}</p>
            </div>
            <div class="post-actions">
              <a href="${encodeURI(post.filename)}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                ページを開く ↗
              </a>
              <button class="btn btn-secondary" onclick="copyUrl('${fullUrl}')">
                🔗 リンクをコピー
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function copyUrl(url) {
      navigator.clipboard.writeText(url).then(() => {
        showToast('URLをコピーしました！');
      }).catch(() => {
        prompt('URLをコピーしてください:', url);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (!query) {
        renderPosts(allPosts);
        return;
      }
      const filtered = allPosts.filter(p => 
        (p.title && p.title.toLowerCase().includes(query)) ||
        (p.description && p.description.toLowerCase().includes(query)) ||
        (p.tags && p.tags.some(t => t.toLowerCase().includes(query)))
      );
      renderPosts(filtered);
    });

    loadPosts();
  </script>
</body>
</html>
