<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スコアボード</title>
<style>
  .scoreboard-container {
    max-width: 600px;
    margin: 20px auto;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  }
  .scoreboard {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
    background-color: #ffffff;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    border-radius: 8px;
    overflow: hidden;
  }
  .scoreboard th, .scoreboard td {
    padding: 10px 8px;
    border: 1px solid #e0e0e0;
  }
  .scoreboard thead th {
    background-color: #2c3e50;
    color: #ffffff;
    font-weight: 600;
  }
  .scoreboard .team-col {
    text-align: left;
    padding-left: 14px;
    font-weight: bold;
    min-width: 130px;
  }
  .scoreboard tbody tr:nth-child(even) {
    background-color: #f9fbfd;
  }
  .scoreboard .total-col {
    font-weight: bold;
    font-size: 1.1em;
    background-color: #edf2f7;
    color: #2d3748;
  }
  .scoreboard .winner {
    color: #c53030;
  }
</style>
</head>
<body>

<div class="scoreboard-container">
  <table class="scoreboard">
    <thead>
      <tr>
        <th class="team-col">チーム名</th>
        <th>1</th>
        <th>2</th>
        <th>3</th>
        <th>4</th>
        <th>5</th>
        <th>6</th>
        <th class="total-col">計</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="team-col">谷端ジュニア</td>
        <td>0</td>
        <td>0</td>
        <td>0</td>
        <td>2</td>
        <td>0</td>
        <td>5</td>
        <td class="total-col winner">7</td>
      </tr>
      <tr>
        <td class="team-col">元加賀</td>
        <td>2</td>
        <td>1</td>
        <td>1</td>
        <td>1</td>
        <td>0</td>
        <td>1</td>
        <td class="total-col">6</td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
