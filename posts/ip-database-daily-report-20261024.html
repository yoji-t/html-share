            ],
            sourceTitle: "生成AI時代の特許関連ツールの選び方と活用のポイント ～2026知財・情報フェア＆コンファレンスを踏まえて～",
            sourceUrl: "https://www.tmi.gr.jp/eyes/blog/2026/18888.html"
          }
        ],
        reminder: {
          title: "【ベンダー動向】",
          text: "国内外の主要商用データベースベンダーにおける過去24時間以内の新規機能リリースは確認されませんでした。",

        }
      },
      {
        date: "2026-09-25",
        displayDate: "2026年09月25日（金）",
        lead: "公的データベースJ-PlatPatにおいて、日本リーガルステータス情報（特許）のバルクデータ提供が開始されました。",
        items: [
          {

            badgeColor: "indigo",

            title: "【J-PlatPat】日本リーガルステータス情報（特許）のバルクデータ提供開始",
            summaryPoints: [
              {
                label: "バルクデータ提供開始",
                text: "2026年9月24日11:00より、出願日が1998年1月1日以降の日本国特許出願に関する「日本リーガルステータス情報（特許）」のバルクデータ提供が開始されました（毎週木曜日に更新データ提供）。"
              },
              {

        ],
        reminder: {

          text: "その他の国内外ベンダーおよび主要な知財実務ブログについては、過去24時間以内の新規機能アップデートは確認されませんでした。",
          otherNote: ""
        }
      }
    ];

    let currentView = "preview"; // "preview" | "html"
    let selectedDate = "2026-10-24";
    let selectedSnippetFormat = "blog"; // "blog" | "full"

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getSelectedReports() {
      if (selectedDate === "all") {
        return REPORTS_DATA;
      }
      return REPORTS_DATA.filter(r => r.date === selectedDate);
    }

    function buildCleanBlogSnippet(reports) {
      const blocks = reports.map(report => {
        const itemsHtml = report.items.map(item => {
          const bullets = item.summaryPoints.map(pt =>
            `      <li style="margin-bottom: 8px;"><strong>${escapeHtml(pt.label)}</strong>：${escapeHtml(pt.text)}</li>`
          ).join("\n");

          return `  <section style="margin-bottom: 24px; padding: 20px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #ffffff;">
    <h3 style="margin-top: 0; margin-bottom: 12px; font-size: 18px; color: #1e293b; border-bottom: 2px solid #4f46e5; padding-bottom: 8px;">
      ${escapeHtml(item.title)}
    </h3>
    <p style="margin: 0 0 12px 0; font-size: 14px; color: #475569;">
      <strong>対象データベース／ベンダー名：</strong>${escapeHtml(item.vendor)}
    </p>
    <div style="font-size: 15px; line-height: 1.7; color: #334155;">
      <p style="margin: 0 0 8px 0; font-weight: bold;">更新内容・要約：</p>
      <ul style="margin: 0 0 16px 0; padding-left: 20px;">
${bullets}
      </ul>
    </div>
    <p style="margin: 0; font-size: 14px;">
      <strong>出典：</strong><a href="${escapeHtml(item.sourceUrl)}" target="_blank" rel="noopener noreferrer" style="color: #4f46e5; text-decoration: underline;">${escapeHtml(item.sourceTitle)}</a>
    </p>
  </section>`;
        }).join("\n\n");

        const otherLine = report.reminder.otherNote
          ? `\n    <p style="margin: 8px 0 0 0; font-size: 13px; color: #64748b;">※${escapeHtml(report.reminder.otherNote)}</p>`
          : "";

        return `<article class="ip-db-daily-report" style="font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; color: #1e293b; line-height: 1.6; max-width: 800px; margin: 0 auto 32px auto;">
  <header style="margin-bottom: 16px;">
    <p style="margin: 0 0 4px 0; font-size: 13px; color: #64748b; font-weight: bold;">${escapeHtml(report.displayDate)} 配信</p>
    <p style="margin: 0; font-size: 15px; color: #334155;">おはようございます。知財データベースに関する本日の情報をお届けします。<br>${escapeHtml(report.lead)}</p>
  </header>

${itemsHtml}

  <section style="padding: 16px; background-color: #f8fafc; border-left: 4px solid #64748b; border-radius: 4px;">
    <h4 style="margin: 0 0 8px 0; font-size: 15px; color: #334155;">${escapeHtml(report.reminder.title)}</h4>
    <p style="margin: 0; font-size: 14px; color: #475569;">${escapeHtml(report.reminder.text)}</p>${otherLine}
  </section>
</article>`;
      });

      return blocks.join("\n\n<hr style=\"border: none; border-top: 1px solid #cbd5e1; margin: 32px 0;\">\n\n");
    }

    function buildFullHtmlDocument(reports) {
      const snippet = buildCleanBlogSnippet(reports);
      const titleDate = selectedDate === "all" ? "アーカイブ一覧" : selectedDate;
      return `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知財データベース最新情報（${titleDate}）</title>
</head>
<body style="background-color: #f1f5f9; margin: 0; padding: 24px;">
${snippet}
</body>
</html>`;
    }

    function renderVisualPreview() {
      const reports = getSelectedReports();
      const container = document.getElementById("renderedReportArea");
      const badge = document.getElementById("headerDateBadge");
      badge.textContent = selectedDate === "all" ? "全8回 アーカイブ表示" : `${reports[0].displayDate} 配信`;

      const htmlParts = reports.map((report, idx) => {
        const cards = report.items.map(item => {
          const pointsHtml = item.summaryPoints.map(pt => `
            <li class="flex items-start gap-2.5 text-sm text-slate-700 leading-relaxed">
              <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 mt-2 shrink-0"></span>
              <div><strong class="font-semibold text-slate-900">${escapeHtml(pt.label)}：</strong>${escapeHtml(pt.text)}</div>
            </li>
          `).join("");

          return `
            <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200">
                  ${escapeHtml(item.category)}
                </span>
                <span class="text-xs font-medium text-slate-500">対象：${escapeHtml(item.vendor)}</span>
              </div>
              <h3 class="text-base sm:text-lg font-bold text-slate-900 leading-snug">
                ${escapeHtml(item.title)}
              </h3>
              <ul class="space-y-2.5 bg-slate-50/80 rounded-lg p-4 border border-slate-100">
                ${pointsHtml}
              </ul>
              <div class="pt-2 border-t border-slate-100 flex items-center justify-between flex-wrap gap-2 text-xs">
                <span class="font-semibold text-slate-500">出典リンク:</span>
                <a href="${escapeHtml(item.sourceUrl)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 font-medium text-indigo-600 hover:text-indigo-500 underline break-all">
                  <span>${escapeHtml(item.sourceTitle)}</span>
                  <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                  </svg>
                </a>
              </div>
            </div>
          `;
        }).join("");

        const otherText = report.reminder.otherNote
          ? `<p class="text-xs text-slate-500 mt-2">※${escapeHtml(report.reminder.otherNote)}</p>`
          : "";

        return `
          <div class="p-6 sm:p-8 ${idx > 0 ? 'border-t border-slate-200' : ''} space-y-6">
            <div class="border-b border-slate-100 pb-4">
              <div class="text-xs font-semibold text-indigo-600 uppercase tracking-wider mb-1">${escapeHtml(report.displayDate)}</div>
              <p class="text-sm sm:text-base text-slate-700 leading-relaxed">
                おはようございます。知財データベースに関する本日の情報をお届けします。<br>
                ${escapeHtml(report.lead)}
              </p>
            </div>
            <div class="space-y-4">
              ${cards}
            </div>
            <div class="rounded-xl bg-amber-50/70 border border-amber-200/80 p-4">
              <h4 class="text-xs sm:text-sm font-bold text-amber-900 mb-1.5">${escapeHtml(report.reminder.title)}</h4>
              <p class="text-xs sm:text-sm text-amber-900/90 leading-relaxed">${escapeHtml(report.reminder.text)}</p>
              ${otherText}
            </div>
          </div>
        `;
      });

      container.innerHTML = htmlParts.join("");
    }

    function renderCodeBlock() {
      const reports = getSelectedReports();
      const codeEl = document.getElementById("rawHtmlCodeBlock");
      const labelEl = document.getElementById("codeHeaderLabel");
      const rawCode = selectedSnippetFormat === "full"
        ? buildFullHtmlDocument(reports)
        : buildCleanBlogSnippet(reports);
      codeEl.textContent = rawCode;
      const suffix = selectedSnippetFormat === "full" ? "full.html" : "snippet.html";
      labelEl.textContent = `ip_db_report_${selectedDate}_${suffix}`;
    }

    function updateAll() {
      renderVisualPreview();
      renderCodeBlock();
    }

    function switchTab(mode) {
      currentView = mode;
      const previewContainer = document.getElementById("previewContainer");
      const htmlCodeContainer = document.getElementById("htmlCodeContainer");
      const tabPreviewBtn = document.getElementById("tabPreviewBtn");
      const tabHtmlBtn = document.getElementById("tabHtmlBtn");

      if (mode === "preview") {
        previewContainer.classList.remove("hidden");
        htmlCodeContainer.classList.add("hidden");
        tabPreviewBtn.className = "px-3 py-1.5 rounded-md text-xs font-medium transition-colors bg-indigo-600 text-white";
        tabHtmlBtn.className = "px-3 py-1.5 rounded-md text-xs font-medium transition-colors text-slate-300 hover:text-white";
      } else {
        previewContainer.classList.add("hidden");
        htmlCodeContainer.classList.remove("hidden");
        tabHtmlBtn.className = "px-3 py-1.5 rounded-md text-xs font-medium transition-colors bg-indigo-600 text-white";
        tabPreviewBtn.className = "px-3 py-1.5 rounded-md text-xs font-medium transition-colors text-slate-300 hover:text-white";
      }
    }

    function showToast(msg) {
      const toast = document.getElementById("toastNotification");
      const toastMsg = document.getElementById("toastMessage");
      toastMsg.textContent = msg;
      toast.classList.remove("hidden");
      toast.classList.add("flex");
      if (window._toastTimer) {
        clearTimeout(window._toastTimer);
      }
      window._toastTimer = setTimeout(() => {
        toast.classList.add("hidden");
        toast.classList.remove("flex");
      }, 2600);
    }

    function copyCurrentHtml() {
      const reports = getSelectedReports();
      const rawCode = selectedSnippetFormat === "full"
        ? buildFullHtmlDocument(reports)
        : buildCleanBlogSnippet(reports);

      const fallbackCopy = (text) => {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
          showToast("HTMLコードをクリップボードにコピーしました");
        } catch (err) {
          showToast("コピーに失敗しました。コード表示タブから選択してください");
        }
        document.body.removeChild(ta);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(rawCode).then(() => {
          showToast("HTMLコードをクリップボードにコピーしました");
        }).catch(() => {
          fallbackCopy(rawCode);
        });
      } else {
        fallbackCopy(rawCode);
      }
    }

    document.getElementById("tabPreviewBtn").addEventListener("click", () => switchTab("preview"));
    document.getElementById("tabHtmlBtn").addEventListener("click", () => switchTab("html"));
    document.getElementById("quickCopyHtmlBtn").addEventListener("click", copyCurrentHtml);
    document.getElementById("copyCodePanelBtn").addEventListener("click", copyCurrentHtml);

    document.getElementById("dateSelector").addEventListener("change", (e) => {
      selectedDate = e.target.value;
      updateAll();
    });

    document.getElementById("snippetFormatSelector").addEventListener("change", (e) => {
      selectedSnippetFormat = e.target.value;
      updateAll();
    });

    updateAll();
  </script>
</body>
</html>
